name: AI YouTube Studio

on:
  workflow_dispatch:
    inputs:
      idea:
        description: "Story idea"
        required: true
        default: "The strange business decision that nobody expected to work"
      duration:
        description: "Long-form duration in minutes"
        required: true
        default: "10"
      shorts:
        description: "Number of Short concepts"
        required: true
        default: "6"
  schedule:
    - cron: "30 4 * * 1,3,5"

permissions:
  contents: read

jobs:
  build-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate production package
        env:
          IDEA: ${{ inputs.idea }}
          DURATION: ${{ inputs.duration }}
          SHORTS: ${{ inputs.shorts }}
        run: |
          python - <<'PY'
          import os
          from studio import build_package, save_package
          idea = os.getenv("IDEA") or "A strange story worth investigating"
          duration = int(os.getenv("DURATION") or "10")
          shorts = int(os.getenv("SHORTS") or "6")
          print(save_package(build_package(idea, duration, shorts)))
          PY
      - name: Validate
        run: |
          python -m compileall .
          test -f output/production_package.json
      - uses: actions/upload-artifact@v4
        with:
          name: production-package
          path: output/production_package.json
