name: test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m pytest
      - name: Install preview renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
      - name: Render and verify sample MP4
        run: |
          python scripts/render_news_preview.py
          test -s output/news-style-preview.mp4
          ffprobe -v error -show_entries stream=codec_name,width,height -show_entries format=duration -of json output/news-style-preview.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 output/news-style-preview.mp4 | grep -qx '1920x1080'
      - uses: actions/upload-artifact@v4
        with:
          name: news-studio-ci-preview
          path: output/news-style-preview.mp4
          retention-days: 7
