name: Newsroom AI Agents

on:
  # Run the dedicated newsroom workflow whenever this development branch changes.
  push:
    branches:
      - news-agent-foundation
  workflow_dispatch:
  schedule:
    # Daily at 01:00 UTC (06:30 India Standard Time).
    - cron: "0 1 * * *"

permissions:
  contents: read

jobs:
  newsroom-research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Run newsroom agent tests
        run: python -m pytest -q
      - name: Run India and Global research agents
        run: python -m newsroom.run
      - name: Upload newsroom report
        uses: actions/upload-artifact@v4
        with:
          name: newsroom-editorial-queue
          path: output/newsroom_report.json
          if-no-files-found: error
          retention-days: 7
